spring.application.name=stockroom
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health

# Embedded in-memory H2 database
spring.datasource.url=jdbc:h2:mem:stockroom;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console off
spring.h2.console.enabled=false

# Run schema.sql on startup
spring.sql.init.mode=always
